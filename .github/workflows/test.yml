name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test on the JVM (against src/test/fixtures/fake-server.mjs, 127.0.0.1 only), lint
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - name: What JitPack runs (jitpack.yml)
        run: ./gradlew --no-daemon publishReleasePublicationToMavenLocal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: build/reports/
